<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Google tag (gtag.js) — Google Ads AW-18508142503.
         Consent Mode v2: ad/analytics storage is denied by default for visitors
         in the EEA, UK and Switzerland (the site has no consent banner), and
         granted elsewhere. Must stay first in <head>. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied',
        region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']
      });
      gtag('consent', 'default', {
        ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18508142503"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'AW-18508142503');
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>American Group LLC — Enterprise Technology & Mobile Apps</title>
    <meta
      name="description"
      content="American Group LLC is a Santa Clara-based technology company building 77+ enterprise-grade mobile apps, AI platforms, and software solutions."
    />

      name="keywords"
      content="American Group LLC, mobile apps, enterprise software, AI, React Native, Santa Clara, technology company"
    />
    <meta name="author" content="American Group LLC" />
    <meta
      property="og:title"
      content="American Group LLC — Enterprise Technology"
    />
    <meta
      property="og:description"
      content="Building the future of technology. 77+ mobile apps and enterprise platforms."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.americangroup.ai" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="American Group LLC" />
    <meta
      name="twitter:description"
      content="Enterprise Technology & Mobile Apps"
    />
    <link rel="canonical" href="https://www.americangroup.ai" />
    <!-- Fonts: Sora (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The analytics tag is injected from src/main.tsx, and only when
      VITE_ANALYTICS_ENDPOINT is actually configured. As a static tag here it
      had no working configuration: unset, Vite leaves the literal
      "%VITE_ANALYTICS_ENDPOINT%" in the src and the browser requests that path
      (400, plus a URIError thrown by Express's serve-static); set to "" — which
      is what .github/workflows/deploy.yml passes — it requested "/umami" (404).
    -->
  </body>
</html>
