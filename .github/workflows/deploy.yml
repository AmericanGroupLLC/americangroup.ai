name: Build & Deploy to HostGator (americangroup.ai)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "americangroup = /home2/safecode/americangroup.ai only; both = also public_html (safecodeg.com, which then 301s to americangroup.ai)"
        type: choice
        options: [americangroup, both]
        default: americangroup

jobs:
  build-and-deploy:
    name: Build React App & Deploy via SSH/rsync
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # ── 4. Cache ─────────────────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build ─────────────────────────────────────────────────────────
      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "agl-scg-website"
          VITE_APP_TITLE: "American Group LLC"
          VITE_FRONTEND_FORGE_API_KEY: ""
          VITE_FRONTEND_FORGE_API_URL: ""
          VITE_OAUTH_PORTAL_URL: ""
          # 6D shared-stage transport (ARCHITECTURE-DIMENSIONS.md §6, §13).
          # The anon key is public-by-design once bundled, but is still
          # sourced from a GitHub Actions secret rather than hardcoded here —
          # same reasoning as the SSH secrets below: keeps it out of this
          # file's git history and lets it be rotated without a code change.
          # Unset secrets resolve to "", which is exactly the safe default:
          # createTransport() returns the null transport and the UI reports
          # "unconfigured" rather than breaking the build.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 7. Show build output ─────────────────────────────────────────────
      - name: Show build output
        run: ls -la dist/public/ && du -sh dist/public/

      # ── 8. Setup SSH key ─────────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: an OpenSSH private key is rejected outright if it
          # lacks a trailing newline, and a rejected key makes ssh fall through
          # to password/keyboard-interactive, which is what exhausts the
          # server's auth-attempt limit and reports "Too many authentication
          # failures". The failure looks like the host refusing us; it is not.
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ftp.safecodeg.com >> ~/.ssh/known_hosts 2>/dev/null

      # Fingerprint only — never the key material. If this step fails, the
      # secret itself is malformed and no amount of ssh options will help.
      - name: Check the deploy key parses
        run: |
          if ssh-keygen -l -f ~/.ssh/deploy_key; then
            echo "deploy key parses OK"
          else
            echo "::error::SSH_PRIVATE_KEY is not a valid private key. \
          Re-add the secret, including the BEGIN/END lines and a trailing newline."
            exit 1
          fi

      # ── 9. Deploy via rsync over SSH ─────────────────────────────────────
      # IdentitiesOnly=yes is load-bearing. Without it ssh offers every key the
      # runner's agent holds before the one named by -i, and HostGator closes
      # the connection with "Received disconnect ... Too many authentication
      # failures" — which is what failed every deploy since 2026-09-06. The
      # host was never blocking us; we were exhausting its auth-attempt limit.
      # americangroup.ai is a cPanel addon domain with its own docroot,
      # /home2/safecode/americangroup.ai (~/americangroup.ai for the account).
      # public_html is safecodeg.com's docroot; the same build there makes
      # every safecodeg.com URL 301 to americangroup.ai (.htaccess). A manual
      # run deploys americangroup.ai only, so the new domain can go live
      # before the old one starts redirecting.
      - name: Deploy to HostGator via rsync
        env:
          PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          rsync -avz --delete -e "$SSH" dist/public/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/americangroup.ai/
          if [ "$TARGET" = "both" ]; then
            rsync -avz --delete -e "$SSH" dist/public/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/
          fi

      # ── 10. Verify ───────────────────────────────────────────────────────
      # Curling the homepage proved nothing: this site serves an SPA catch-all,
      # so every path returns 200 with the homepage even when the file is
      # absent. That is how store listings ended up pointing at pages that did
      # not exist while every check reported "live". Verify a real deployed
      # page instead, and fail the job if it is the homepage wearing a disguise.
      - name: Verify a deployed page is really there
        run: |
          sleep 5
          URL=https://www.americangroup.ai/policy/virtuband/delete-account.html
          BODY=$(curl -sL --max-time 30 "$URL")
          if printf '%s' "$BODY" | grep -q "Enterprise Technology & Mobile Apps"; then
            echo "::error::$URL served the marketing homepage — the file is not deployed."
            exit 1
          fi
          printf '%s' "$BODY" | grep -qi "delete" || {
            echo "::error::$URL did not look like the deletion page."; exit 1; }
          echo "✅ $URL is really deployed ($(printf '%s' "$BODY" | wc -c) bytes)"

      # ── 11. Summary ──────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "🌐 https://www.americangroup.ai"
          echo "🔒 HTTPS enforced via .htaccess"
          echo "📦 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
